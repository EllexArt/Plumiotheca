version: 2
updates:
  # Le code de apps/ va être réécrit (jalons M0-M1) : peu de PR à la fois,
  # et un délai de 7 jours avant de proposer une nouvelle version
  # (les paquets compromis sont souvent retirés dans ce délai).
  # Un seul lockfile pnpm à la racine pour tout le monorepo.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      mineures:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    ignore:
      # Les types de Node suivent la version réellement utilisée (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Met à jour les SHA des actions épinglées dans .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Montée de version majeure de Node planifiée à part (LTS uniquement, voir l'issue dédiée).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
