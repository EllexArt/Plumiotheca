name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Annule les exécutions dépassées d'une PR, jamais celles de main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  api:
    name: API (build et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activer Yarn (corepack)
        run: corepack enable

      - name: Récupérer le cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('apps/api/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Installer les dépendances
        run: yarn install --frozen-lockfile

      - name: Compiler (vérifie aussi les types)
        run: yarn build

      - name: Tests
        run: yarn test --ci

  web:
    name: Web (types et build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: |
          for app in shell reader editor; do
            echo "::group::tsc $app"
            npx tsc -p "apps/$app/tsconfig.json" --noEmit
            echo "::endgroup::"
          done

      - name: Build
        run: npm run build

  dependances:
    name: Dépendances (vulnérabilités connues)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bloquer les dépendances ajoutées avec une vulnérabilité élevée
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
