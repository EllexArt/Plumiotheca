name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Annule les exécutions dépassées d'une PR, jamais celles de main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Les noms des jobs servent de vérifications obligatoires dans la protection de main :
# ne pas les renommer sans mettre la protection à jour.
jobs:
  api:
    name: API (build et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Base éphémère pour les tests et la vérification des migrations. Même version
    # que infra/docker-compose.yml (à mettre à jour ensemble).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: plumiotheca
          POSTGRES_PASSWORD: ci-uniquement
          POSTGRES_DB: plumiotheca
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U plumiotheca" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      DB_HOST: localhost
      DB_PORT: '5433'
      DB_USERNAME: plumiotheca
      DB_PASSWORD: ci-uniquement
      DB_NAME: plumiotheca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # « @plumiotheca/api... » : l'API et les paquets dont elle dépend ; « ./packages/* » :
      # tous les paquets partagés, même ceux que l'API n'utilise pas encore.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile --filter "@plumiotheca/api..." --filter "./packages/*"

      - name: Vérifier les types
        run: pnpm --filter "@plumiotheca/api..." --filter "./packages/*" typecheck

      - name: Compiler
        run: pnpm --filter "@plumiotheca/api..." --filter "./packages/*" build

      # Appliquer, annuler, réappliquer : le retour arrière doit fonctionner aussi.
      - name: Migrations sur une base vide (aller-retour)
        run: |
          pnpm --filter @plumiotheca/api migration:run
          pnpm --filter @plumiotheca/api migration:revert
          pnpm --filter @plumiotheca/api migration:run

      # Échoue si les entités ont changé sans migration correspondante.
      - name: Aucune migration ne manque
        run: pnpm --filter @plumiotheca/api migration:check

      - name: Tests
        run: pnpm --filter "@plumiotheca/api..." --filter "./packages/*" test

  web:
    name: Web (types et build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile --filter "./apps/web/**"

      - name: Vérifier les types
        run: pnpm --filter "./apps/web/apps/*" typecheck

      - name: Build
        run: pnpm --filter "./apps/web/apps/*" build

  qualite:
    name: Qualité (lint, accessibilité, formatage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint (dont règles d'accessibilité jsx-a11y)
        run: pnpm lint

      - name: Formatage
        run: pnpm format:check

  dependances:
    name: Dépendances (vulnérabilités connues)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bloquer les dépendances ajoutées avec une vulnérabilité élevée
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
