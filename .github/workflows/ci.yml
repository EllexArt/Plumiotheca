name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Annule les exécutions dépassées d'une PR, jamais celles de main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Les noms des jobs servent de vérifications obligatoires dans la protection de main :
# ne pas les renommer sans mettre la protection à jour.
jobs:
  api:
    name: API (build et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile --filter @plumiotheca/api

      - name: Vérifier les types
        run: pnpm --filter @plumiotheca/api typecheck

      - name: Compiler
        run: pnpm --filter @plumiotheca/api build

      - name: Tests
        run: pnpm --filter @plumiotheca/api test --ci

  web:
    name: Web (types et build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile --filter "./apps/web/**"

      - name: Vérifier les types
        run: pnpm --filter "./apps/web/apps/*" typecheck

      - name: Build
        run: pnpm --filter "./apps/web/apps/*" build

  dependances:
    name: Dépendances (vulnérabilités connues)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Bloquer les dépendances ajoutées avec une vulnérabilité élevée
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
