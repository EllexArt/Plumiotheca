name: Infra

# Démarre l'infrastructure de développement et vérifie Keycloak de bout en bout
# (import du realm, connexion navigateur + PKCE, audience, MFA modération, e-mails),
# avec l'API conteneurisée qui doit accepter les jetons obtenus dans le navigateur.
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    name: Infra (Keycloak, Postgres, Garage, Meilisearch, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Secrets de développement aléatoires
        run: node infra/scripts/setup.mjs

      - name: Démarrer l'infrastructure
        run: |
          docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --wait
          node infra/scripts/garage-init.mjs

      # L'API lit les clés publiques par le réseau interne (keycloak:8080) mais attend
      # l'émetteur vu par le navigateur (localhost:8080) : le cas d'un vrai déploiement.
      - name: Démarrer l'API conteneurisée
        run: |
          docker build -f apps/api/Dockerfile -t plumiotheca-api:ci .
          set -a; . infra/.env; set +a
          docker run -d --name plumiotheca-api --network plumiotheca_default \
            -p 127.0.0.1:3000:3000 \
            -e DB_HOST=postgres -e DB_PORT=5432 -e DB_USERNAME="$POSTGRES_USER" \
            -e DB_PASSWORD="$POSTGRES_PASSWORD" -e DB_NAME="$POSTGRES_DB" \
            -e DB_MIGRATE_ON_START=true \
            -e CORS_ORIGINS=http://localhost:5173 -e TRUST_PROXY=0 \
            -e KEYCLOAK_ISSUER=http://localhost:8080/realms/plumiotheca \
            -e KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/plumiotheca/protocol/openid-connect/certs \
            plumiotheca-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs plumiotheca-api; exit 1

      - name: Vérifier le realm Keycloak et l'API
        env:
          API_REQUIRED: '1'
        run: node infra/scripts/check-realm.mjs

      # Libère le réseau de Compose avant le test de redémarrage.
      - name: Arrêter l'API
        run: docker rm -f plumiotheca-api

      - name: Les comptes survivent à un redémarrage
        run: |
          node infra/scripts/check-persistence.mjs ecrire
          docker compose -f infra/docker-compose.yml --env-file infra/.env down
          docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --wait
          node infra/scripts/check-persistence.mjs lire

      - name: Comptes de démonstration
        run: node infra/scripts/seed-dev.mjs

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          if [ -f infra/.env ]; then
            docker compose -f infra/docker-compose.yml --env-file infra/.env logs --no-color --tail 200
          fi
          docker logs plumiotheca-api 2>&1 | tail -100 || true
