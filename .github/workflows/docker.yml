name: Images Docker

# Construit les images de l'API et du site sur chaque PR qui les touche et sur main/develop
# (vérification, sans publication). Les publie sur GitHub Container Registry seulement pour
# un tag de version vX.Y.Z (#6) : ghcr.io/<dépôt>-api et ghcr.io/<dépôt>-web.
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'docs/charte.md'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'docs/charte.md'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: Image de l'API (construction)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: plumiotheca-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    name: Image du site (construction)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: plumiotheca-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # La configuration nginx est valide et les en-têtes de sécurité sont envoyés.
      - name: Vérifier les en-têtes de sécurité
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 plumiotheca-web:ci
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          headers=$(curl -s -D - -o page.html http://localhost:8080/ecrire)
          echo "$headers"
          for h in Content-Security-Policy Referrer-Policy X-Content-Type-Options Permissions-Policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::En-tête $h absent"; exit 1; }
          done
          nonce=$(echo "$headers" | grep -io "nonce-[a-f0-9]\{32\}" | cut -d- -f2)
          grep -q "csp-nonce\" content=\"$nonce\"" page.html || { echo "::error::Nonce de la page différent de celui de la CSP"; exit 1; }
          curl -sf http://localhost:8080/config.js | grep -q 'window.PLUMIOTHECA'

  # Publication : seulement pour un tag de version, après les deux constructions.
  publier:
    name: Publication des images (GHCR)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étiquettes : X.Y.Z, X.Y et l'empreinte du commit (jamais « latest » implicite).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
