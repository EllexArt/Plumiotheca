name: Images Docker

# Vérifie que l'image de l'API se construit, sur chaque PR qui la touche et sur main.
# Aucune image n'est publiée pour l'instant : la publication sur GitHub Container
# Registry, déclenchée par les tags de version, sera ajoutée avec l'issue #6.
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: Image de l'API (construction)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: plumiotheca-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
