name: Images Docker

# Vérifie que l'image de l'API se construit, sur chaque PR qui la touche et sur main.
# Aucune image n'est publiée tant que l'API n'a pas été réécrite (jalon M1) :
# la publication sur GitHub Container Registry, déclenchée par les tags de version,
# sera ajoutée avec l'issue #6.
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: Image de l'API (construction)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: plumiotheca-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
