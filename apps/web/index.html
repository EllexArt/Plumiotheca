<html lang="fr">

    <meta name="color-scheme" content="light dark" />
    <!-- Nonce de la CSP, remplacé à chaque réponse par nginx (src/shared/csp-nonce.ts). -->

    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />

    <title>Plumiotheca</title>
    <!-- Thème choisi appliqué avant l'affichage (pas de flash clair → sombre). Fichier
         séparé plutôt qu'un script en ligne : compatible avec une CSP stricte. -->
    <!-- Configuration de l'environnement (adresse de Keycloak, de l'API), avant l'application. -->
    <script src="/config.js"></script>
    <script src="/theme.js"></script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
