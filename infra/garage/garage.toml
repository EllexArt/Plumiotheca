# Garage en nœud unique pour le développement.
# rpc_secret et admin_token viennent des variables d'environnement (infra/.env).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

# Site web des buckets publics : http://medias.web.garage.localhost:3902 sert le bucket
# « medias », sur un domaine séparé de celui du site (#18).
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
