packages:
  - apps/api
  - apps/web
  - packages/*
  - e2e

# Scripts d'installation des dépendances : refusés par défaut (sécurité).
# Seul esbuild (Vite) est autorisé. @scarf/scarf (télémétrie de swagger-ui)
# est volontairement bloqué.
# @swc/core (tests de l'API) n'en a pas besoin : son binaire arrive par une
# dépendance optionnelle propre à chaque plateforme.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  unrs-resolver: false
  # Les hooks Git sont installés par le script « prepare » de la racine.
  simple-git-hooks: false

# Délai de 7 jours avant d'accepter une version publiée (aussi pour pnpm add) :
# les paquets compromis sont souvent retirés dans ce délai.
minimumReleaseAge: 10080
