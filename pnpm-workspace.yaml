packages:
  - apps/api
  - apps/web
  - apps/web/apps/*
  - apps/web/libs/*

# Scripts d'installation des dépendances : refusés par défaut (sécurité).
# Seul esbuild (Vite) est autorisé. chromedriver (tiré par keycloak-connect)
# et @scarf/scarf (télémétrie de swagger-ui) sont volontairement bloqués.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@scarf/scarf': false
  chromedriver: false
  unrs-resolver: false
  # Les hooks Git sont installés par le script « prepare » de la racine.
  simple-git-hooks: false

# Délai de 7 jours avant d'accepter une version publiée (aussi pour pnpm add) :
# les paquets compromis sont souvent retirés dans ce délai.
minimumReleaseAge: 10080

# Dépendance optionnelle inutile de keycloak-connect, jamais installée.
ignoredOptionalDependencies:
  - chromedriver
